name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  source-build:
    name: Validate and build tracked snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Detect tracked source
        id: source
        shell: bash
        run: |
          if [[ -f data/upstream/source.json && -f data/upstream/cedict_1_0_ts_utf-8_mdbg.zip ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No manually ingested CC-CEDICT snapshot is tracked yet."
          fi
      - name: Build twice
        if: steps.source.outputs.available == 'true'
        env:
          CEDICT_BOOX_COMMIT: ${{ github.sha }}
        run: |
          python -m cedict_boox build --output dist-one
          python -m cedict_boox build --output dist-two
      - name: Check reproducibility
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          first="$(find dist-one -maxdepth 1 -name '*.zip' -print -quit)"
          second="$(find dist-two -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$first" && test -n "$second"
          test "$(sha256sum "$first" | cut -d' ' -f1)" = "$(sha256sum "$second" | cut -d' ' -f1)"
          python -m cedict_boox verify "$first"
      - name: Collect artifacts
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          mkdir ci-artifacts
          cp dist-one/*.zip dist-one/*.sha256 dist-one/build-report.json ci-artifacts/
          cp data/upstream/source.json ci-artifacts/
      - name: Upload build artifacts
        if: steps.source.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cc-cedict-boox
          path: ci-artifacts/
          if-no-files-found: error

