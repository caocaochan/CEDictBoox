name: Release

on:
  push:
    branches: [main]
    paths:
      - data/upstream/source.json
      - data/upstream/cedict_1_0_ts_utf-8_mdbg.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cc-cedict-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Select release tag, build, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CEDICT_BOOX_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f data/upstream/source.json
          test -f data/upstream/cedict_1_0_ts_utf-8_mdbg.zip

          release_date="$(python -c "import json; print(json.load(open('data/upstream/source.json', encoding='utf-8'))['release_date'])")"
          source_sha="$(python -c "import json; print(json.load(open('data/upstream/source.json', encoding='utf-8'))['archive_sha256'])")"
          base_tag="cc-cedict-${release_date}"

          while IFS= read -r existing_tag; do
            [[ -n "$existing_tag" ]] || continue
            body="$(gh release view "$existing_tag" --json body --jq .body)"
            if grep -Fq "Source-Archive-SHA256: ${source_sha}" <<<"$body" \
              && grep -Fq "Converter-Commit: ${GITHUB_SHA}" <<<"$body"; then
              echo "An identical release already exists: ${existing_tag}"
              exit 0
            fi
          done < <(git tag --list "${base_tag}*")

          revision=1
          tag="$base_tag"
          while gh release view "$tag" >/dev/null 2>&1 \
            || git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; do
            revision=$((revision + 1))
            tag="${base_tag}-r${revision}"
          done

          python -m cedict_boox build --output dist --revision "$revision"
          archive="$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
          checksum="${archive}.sha256"
          mdx="$(find dist -maxdepth 1 -name '*.mdx' -print -quit)"
          mdx_checksum="${mdx}.sha256"
          test -n "$archive" && test -n "$mdx"
          python -m cedict_boox verify "$archive"
          python -m cedict_boox verify "$mdx"

          parsed="$(python -c "import json; print(json.load(open('dist/build-report.json'))['parsed_entries'])")"
          keys="$(python -c "import json; print(json.load(open('dist/build-report.json'))['unique_lookup_keys'])")"
          cat > release-notes.md <<EOF
          Automated BOOX StarDict and MDict 2.0 builds from the verified
          CC-CEDICT release dated ${release_date}.

          - Parsed CC-CEDICT entries: ${parsed}
          - Unified simplified/traditional lookup keys: ${keys}
          - Source-Archive-SHA256: ${source_sha}
          - Converter-Commit: ${GITHUB_SHA}
          - Data license: CC BY-SA 4.0
          - Physical BOOX 4.1 validation pending

          Install either format, not both:

          - StarDict: extract the included \`CC-CEDICT-Boox\` folder under
            \`Internal shared storage/dicts/\`.
          - MDict: copy the \`.mdx\` file into its own folder under
            \`Internal shared storage/dicts/\`.

          Then select the dictionary in Preferred Dictionary.
          EOF

          gh release create "$tag" \
            "$archive" \
            "$checksum" \
            "$mdx" \
            "$mdx_checksum" \
            "dist/build-report.json" \
            "data/upstream/source.json" \
            --target "$GITHUB_SHA" \
            --title "CC-CEDICT for BOOX ${release_date}${tag#"$base_tag"}" \
            --notes-file release-notes.md \
            --latest
