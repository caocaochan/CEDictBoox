[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cedict-boox"
version = "0.1.0"
description = "Reproducible CC-CEDICT to StarDict builds for BOOX readers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CEDictBoox contributors" }]
dependencies = []

[project.scripts]
cedict-boox = "cedict_boox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

